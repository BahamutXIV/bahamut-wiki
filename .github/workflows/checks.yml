name: Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt

      - name: Lint Python
        run: python -m ruff check --no-cache tools

      - name: Check Python formatting
        run: python -m ruff format --check --no-cache tools

      - name: Run tests
        run: python -m unittest discover -s tools/tests

      - name: Validate protected configuration
        run: python tools/deploy-config.py --all
